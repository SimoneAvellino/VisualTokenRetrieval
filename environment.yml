name: dl-project
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8 # Modificare a seconda del target
  # Add other conda packages here
  - pip:
      - numpy
      - pandas
      - matplotlib
      - scikit-learn
      - pyyaml
      - tensorboard
      - tqdm
      # --- project deps ---
      - transformers        # Qwen3-VL + CLIP text encoder/tokenizer
      - opencv-python        # video frame decoding (cv2)
      - pillow               # frame -> PIL.Image
      - xlstm                # xLSTM block stack (token compressor)
      - wandb                # optional run logging
      # - flash-attn         # cluster-only; install on the GPU VM if available
      # Add other pip-only packages here
