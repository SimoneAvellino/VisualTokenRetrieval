# Model ladder — CLUSTER.
# Trains, in order, the trivial baselines and then models with progressively
# more complex loss functions, writing one summary JSON entry per step and the
# cross-model improvement chart at the end.
#
# Run:     python -m src.training.ladder --config experiments/configs/ladder_cluster.yaml
# Dry run: set dry_run: true below (caps epochs/batches to validate the wiring)
# Resume:  just re-run — finished steps in the summary JSON are skipped.

# all data / model / optimization hyperparameters are inherited from this file:
base_config: experiments/configs/train_cluster.yaml

results_dir: /home/vllsmn02h03b202i/rosario/results
figures_dir: /home/vllsmn02h03b202i/rosario/figures
summary_name: ladder_summary.json

eval_split: test
early_stopping_patience: 2   # stop a model after 2 epochs without val improvement

# dry-run: tiny end-to-end pass (validate the pipeline, not the science)
dry_run: false
dry_run_epochs: 1
dry_run_max_batches: 4

# trivial, non-trained floors
baselines:
  - mean_token
  - center_window

# trained models — each adds one loss term to the previous one
steps:
  - name: 02_mse_only
    overrides: {mse_weight: 1.0, cosine_weight: 0.0, norm_weight: 0.0, softdtw_weight: 0.0, infonce_weight: 0.0, length_weight: 0.0, num_temporal_negatives: 0}
  - name: 03_mse_cosine
    overrides: {mse_weight: 1.0, cosine_weight: 0.1, norm_weight: 0.0, softdtw_weight: 0.0, infonce_weight: 0.0, length_weight: 0.0, num_temporal_negatives: 0}
  - name: 04_norm
    overrides: {mse_weight: 1.0, cosine_weight: 0.1, norm_weight: 0.05, softdtw_weight: 0.0, infonce_weight: 0.0, length_weight: 0.0, num_temporal_negatives: 0}
  - name: 05_softdtw
    overrides: {mse_weight: 0.5, cosine_weight: 0.1, norm_weight: 0.05, softdtw_weight: 1.0, infonce_weight: 0.0, length_weight: 0.0, num_temporal_negatives: 0}
  - name: 06_infonce_full
    overrides: {mse_weight: 0.5, cosine_weight: 0.1, norm_weight: 0.05, softdtw_weight: 1.0, infonce_weight: 0.5, length_weight: 0.0, num_temporal_negatives: 16}
  # same full loss as 06, but a much smaller model (internal dim 1024, 1 xLSTM
  # block, 16 queries, 1 decoder layer) — right-sized for the small dataset.
  - name: 07_small_full
    overrides: {model_dim: 1024, xlstm_num_blocks: 1, xlstm_slstm_at: [0], num_queries: 16, decoder_layers: 1, mse_weight: 0.5, cosine_weight: 0.1, norm_weight: 0.05, softdtw_weight: 1.0, infonce_weight: 0.5, length_weight: 0.0, num_temporal_negatives: 16}
