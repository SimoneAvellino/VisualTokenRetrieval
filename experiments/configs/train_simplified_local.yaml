# Training — LOCAL (Mac / CPU) — SIMPLIFIED mean-token model.
# Small scale, for development & dry runs. See train_simplified_cluster.yaml for
# the architecture description.

# paths (relative to repo root; data/ is gitignored)
tokens_dir: ./data/visual_tokens/Ego4D
annotations: ./data/annotations.json
checkpoint_dir: ./experiments/checkpoints_mean
pretrained_compressor: ""
recursive_tokens: false

# device / runtime
device: auto
dtype: fp32                   # no bf16 off-cuda
num_workers: 0                # 0 avoids macOS multiprocessing issues
seed: 42

# token loading
pool_to_fps: 1

# GT window augmentation
gt_max_left_pad: 30.0
gt_max_right_pad: 30.0
gt_window_zero_dur_pad: 5.0
gt_exact_prob: 0.2

# CLIP (raw output is used directly; core dim = CLIP text hidden = 768)
clip_model: openai/clip-vit-large-patch14
max_question_len: 77

# data (smaller sequences to fit a laptop)
context_strategy: full_until_query
random_crop_extra_min: 16
random_crop_extra_max: 128
max_seq_len: 256
out_len: 32
val_ratio: 0.2
test_ratio: 0.2

decode_mode: length_aware
max_out_len: 48

# model
model_type: mean
embed_dim: 4096
num_heads: 8
decoder_layers: 2
dropout: 0.1
xlstm_num_blocks: 2
xlstm_slstm_at: [1]

# optimization
batch_size: 4
gradient_accumulation_steps: 1
epochs: 3
learning_rate: 3.0e-4
weight_decay: 1.0e-2
grad_clip: 1.0

# loss
cosine_weight: 0.1
batch_infonce_weight: 1.0
batch_infonce_temperature: 0.07
batch_infonce_symmetric: true
num_temporal_negatives: 24   # same-video temporal hard negatives (now used by MeanInfoNCELoss)
length_weight: 0.0
length_warmup_epochs: 0

# checkpoint selection + early stopping
checkpoint_metric: loss
early_stopping_patience: 3

# control flow
dry_run: false
resume: ""

# evaluation
eval_checkpoint: ""
eval_split: test
